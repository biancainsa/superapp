<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f855a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Súper Familiar</title>
<style>
  :root { --verde:#2f855a; --verde2:#e6f4ec; --rojo:#c53030; --gris:#6b7280; --borde:#dfe5df; --fondo:#f4f7f4; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--fondo); color:#1f2937; padding-bottom:84px; }
  header { background:var(--verde); color:#fff; padding:14px 16px; font-size:18px; font-weight:600; position:sticky; top:0; z-index:5; }
  main { padding:12px 14px; max-width:640px; margin:0 auto; }
  h3 { margin:18px 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--gris); }
  .sub { color:var(--gris); margin:4px 0 8px; font-size:14px; }
  .vacio { text-align:center; color:var(--gris); padding:40px 0; font-size:17px; }
  .fila { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--borde); border-radius:12px; padding:10px 12px; margin-bottom:7px; }
  .fila .n { flex:1; font-size:16px; }
  .fila .n small { display:block; color:var(--gris); font-size:12px; }
  .fila .c { color:var(--verde); font-weight:700; }
  .tach { text-decoration:line-through; color:var(--gris); }
  input[type=checkbox] { width:24px; height:24px; accent-color:var(--verde); }
  .tag { background:#fde8e8; color:var(--rojo); font-size:11px; padding:2px 7px; border-radius:99px; margin-left:4px; vertical-align:middle; }
  .step { display:flex; align-items:center; gap:8px; }
  .step button { width:34px; height:34px; border-radius:50%; border:1px solid var(--borde); background:#fff; font-size:20px; line-height:1; }
  .step b { min-width:24px; text-align:center; }
  .ic { border:none; background:none; font-size:19px; padding:4px; opacity:.45; }
  .ic.on { opacity:1; }
  button { font:inherit; cursor:pointer; }
  .grande { display:block; width:100%; margin-top:16px; padding:14px; border:none; border-radius:12px; background:var(--verde); color:#fff; font-size:17px; font-weight:600; }
  .sec { background:#fff; border:1px dashed var(--verde); color:var(--verde); }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:1px solid var(--borde); z-index:6; }
  nav button { flex:1; border:none; background:none; padding:9px 0 11px; font-size:11px; color:var(--gris); }
  nav button span { display:block; font-size:20px; }
  nav button.act { color:var(--verde); font-weight:700; }
  dialog { border:none; border-radius:16px; padding:18px; width:min(92vw,420px); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog h3 { margin-top:0; color:#111; font-size:17px; text-transform:none; letter-spacing:0; }
  label.campo { display:block; font-size:13px; color:var(--gris); margin-bottom:10px; }
  label.campo input, label.campo select, .login input { display:block; width:100%; margin-top:4px; padding:10px; font-size:16px; border:1px solid var(--borde); border-radius:8px; }
  .tres { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .acc { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  .acc button { padding:10px 14px; border-radius:8px; border:1px solid var(--borde); background:#fff; }
  .acc .ok { background:var(--verde); color:#fff; border-color:var(--verde); }
  .acc .rojo { color:var(--rojo); margin-right:auto; }
  .mes { background:#fff; border:1px solid var(--borde); border-radius:12px; padding:12px; margin-bottom:10px; }
  .mes .tot { display:flex; justify-content:space-between; align-items:baseline; }
  .mes .tot b { font-size:20px; }
  .mes .mn { font-weight:600; text-transform:capitalize; }
  .dif { font-size:12px; }
  .sube { color:var(--rojo); } .baja { color:var(--verde); }
  .compra { display:flex; justify-content:space-between; align-items:center; font-size:14px; padding:6px 0; border-top:1px solid var(--borde); margin-top:6px; }
  .login { max-width:360px; margin:15vh auto; padding:0 20px; text-align:center; }
  .login h1 { color:var(--verde); }
  .err { color:var(--rojo); min-height:20px; }
</style>
</head>
<body>
<header>🛒 Súper Familiar</header>
<main id="main"></main>
<nav id="nav" hidden>
  <button data-a="vista" data-v="lista"><span>🛒</span>Lista</button>
  <button data-a="vista" data-v="despensa"><span>🏠</span>Despensa</button>
  <button data-a="vista" data-v="plan"><span>📅</span>Plan</button>
  <button data-a="vista" data-v="gastos"><span>💰</span>Gastos</button>
  <button data-a="vista" data-v="ajustes"><span>⚙️</span>Ajustes</button>
</nav>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
